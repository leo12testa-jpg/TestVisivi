<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Aggiorna anagrafiche - Test Visivi</title>
  <meta name="theme-color" content="#153e69" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <a class="back" href="./index.html" aria-label="Indietro">‹</a>
    <h1>Aggiorna anagrafiche</h1>
  </header>

  <main>
    <section class="page-intro compact">
      <div>
        <p class="eyebrow">DATI ANAGRAFICI / VISIVI</p>
        <h2>Importa la tabella senza perdere gli altri dati</h2>
        <p class="intro-description">Il file resta sul tuo dispositivo: vengono aggiornati solo acuità visiva, mano, piede e occhio dominante. Prima della scrittura viene scaricato un backup.</p>
      </div>
    </section>

    <section class="card">
      <div class="field">
        <label for="anagrafica-file">File JSON anagrafiche</label>
        <input id="anagrafica-file" type="file" accept=".json,application/json" />
      </div>
      <div id="anagrafica-summary"><p class="meta">Nessun file selezionato.</p></div>
      <button type="button" id="anagrafica-apply" disabled>Applica aggiornamento</button>
    </section>

    <section class="card" id="anagrafica-report-card" hidden>
      <p class="eyebrow">ESITO</p>
      <div id="anagrafica-report" class="jet-sync-log" aria-live="polite"></div>
    </section>
  </main>

  <script src="./vendor/firebase/firebase-app-compat.js"></script>
  <script src="./vendor/firebase/firebase-auth-compat.js"></script>
  <script src="./vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/esercizi-config.js"></script>
  <script src="./js/jet-normalizer.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/archive-utils.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/page-sincronizza-anagrafiche.js"></script>
</body>
</html>
