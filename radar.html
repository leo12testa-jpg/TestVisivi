<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Radar - Test Visivi</title>
  <meta name="theme-color" content="#153e69" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <a class="back" id="back-link" href="./index.html" aria-label="Indietro">‹</a>
    <h1 id="titolo-pagina">Radar</h1>
  </header>
  <main>
    <section class="page-intro compact radar-intro-simple">
      <div>
        <p class="eyebrow">RADAR ATLETA</p>
        <h2>Profilo dei test</h2>
        <p class="intro-description">Per ora il radar usa solo i 5 Test concordati e i relativi parametri principali. Ogni asse mostra un indice 0-100; i Training sono esclusi.</p>
      </div>
    </section>

    <section class="card radar-date-filter">
      <div class="radar-date-filter-heading">
        <div><h2>Periodo di riferimento</h2><p class="meta">Per ogni test viene considerata l’ultima misurazione valida nel periodo selezionato.</p></div>
        <button type="button" class="secondary" id="radar-reset-date">Tutto lo storico</button>
      </div>
      <div class="field-grid radar-date-fields">
        <div class="field"><label for="radar-date-from">Dal</label><input type="date" id="radar-date-from" /></div>
        <div class="field"><label for="radar-date-to">Al</label><input type="date" id="radar-date-to" /></div>
      </div>
      <p class="meta" id="radar-date-status" role="status"></p>
    </section>
    <div id="contenuto-radar"></div>
  </main>

  <script src="./vendor/firebase/firebase-app-compat.js"></script>
  <script src="./vendor/firebase/firebase-auth-compat.js"></script>
  <script src="./vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/esercizi-config.js"></script>
  <script src="./js/jet-normalizer.js"></script>
  <script src="./js/radar-config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/db.js"></script>
  <script src="./vendor/chart.umd.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/page-radar.js"></script>
</body>
</html>
