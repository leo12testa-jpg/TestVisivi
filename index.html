<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JetProgram Tracker</title>
  <meta name="theme-color" content="#153e69" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>JetProgram Tracker</h1>
  </header>
  <main>
    <div class="search-bar">
      <input type="text" id="ricerca" placeholder="Cerca atleta per nome o cognome..." />
    </div>

    <div class="fab-row row">
      <button id="btn-nuovo-atleta">+ Nuovo atleta</button>
      <a class="btn secondary" href="./confronto.html" style="text-decoration:none;">Confronto atleti</a>
    </div>

    <div class="card" id="form-nuovo-atleta" hidden>
      <div class="field-grid">
        <div class="field">
          <label for="nuovo-nome">Nome</label>
          <input type="text" id="nuovo-nome" autocomplete="off" />
        </div>
        <div class="field">
          <label for="nuovo-cognome">Cognome</label>
          <input type="text" id="nuovo-cognome" autocomplete="off" />
        </div>
      </div>
      <div class="row">
        <button id="btn-crea-atleta">Crea atleta</button>
        <button class="secondary" id="btn-annulla-atleta">Annulla</button>
      </div>
    </div>

    <div id="lista-atleti" class="list"></div>
  </main>

  <script src="./vendor/firebase/firebase-app-compat.js"></script>
  <script src="./vendor/firebase/firebase-auth-compat.js"></script>
  <script src="./vendor/firebase/firebase-firestore-compat.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/page-atleti.js"></script>
</body>
</html>
